[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clicktag"
dynamic = ["version"]
description = "Official Python SDK for Clicktag API analytics: FastAPI, Starlette, Flask and any ASGI or WSGI app."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Bitgate" }]
keywords = ["analytics", "api", "monitoring", "observability", "fastapi", "starlette", "flask", "asgi", "wsgi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "flask>=2.3"]

[project.urls]
Homepage = "https://clicktag.io"
Source = "https://github.com/clicktag-io/clicktag-python"
Issues = "https://github.com/clicktag-io/clicktag-python/issues"

[tool.hatch.version]
path = "src/clicktag/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clicktag"]

[tool.hatch.build.targets.sdist]
include = ["src/clicktag", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["worker: runs the real background flush thread"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
